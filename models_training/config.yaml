run:
  mode: "local" # "local" or "slurm"
  task: "detection" # "segmentation", "detection", or "obb"
  output_dir: "results"
  train_script: "train.py"

slurm:
  account: "studiegrupper-vortex"
  partition: "GPUQ"
  gpus: 1
  gpu_type: "a100"
  constraint: "gpu40g|gpu80g|gpu32g"
  cpus: 8
  mem: "32G"
  time: "1:00:00"
  job_name: "yolo-train"
  nodes: 1
  ntasks: 1

models:

  segmentation:
    roboflow:
      workspace_id: "hei-qp1ee"
      project_id: "pipe_seg_merge_jan_2026"
      version: 1
      dataset_format: "yolo26"
    model: "yolo26s-seg.pt"
    epochs: 100
    batch: -1
    imgsz: 640
    patience: 30
    requirements: "requirements-segmentation.txt"

  detection:
    roboflow:
      workspace_id: "hei-qp1ee"
      project_id: "simulatorvalve-4rcbu"
      version: 1
      dataset_format: "yolov8"
    model: "yolov8m.pt"
    epochs: 200
    batch: -1
    imgsz: 640
    patience: 30
    requirements: "requirements-detection.txt"

  obb:
    roboflow:
      workspace_id: "hei-qp1ee"
      project_id: "valve_obb_annotations-ejsa6"
      version: 2
      dataset_format: "yolov8"
    model: "yolo26m-obb.pt"
    epochs: 200
    batch: -1
    imgsz: 640
    patience: 30
    requirements: "requirements-obb.txt"
