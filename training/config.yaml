run:
  mode: "local" # "local" or "slurm"
  task: "obb" # "segment", "detect", "obb", "classify"
  output_dir: "results" # where training outputs/logs go
  train_script: "train.py" # training entry script

slurm:
  account: "studiegrupper-vortex" # Slurm account name
  partition: "GPUQ" # queue/partition to use
  gpus: 1 # number of GPUs
  gpu_type: "a100" # requested GPU model
  constraint: "gpu40g|gpu80g|gpu32g" # allowed GPU memory types
  cpus: 10 # CPU cores allocated, by default model.train uses 8 cores
  mem: "32G" # RAM allocated
  time: "2:00:00" # job time limit
  nodes: 1 # number of nodes
  ntasks: 1 # tasks per job

models:
  segment:
    roboflow:
      workspace_id: "hei-qp1ee" # Roboflow workspace ID
      project_id: "sonar-segmentation" # dataset project
      version: 1 # dataset version
      dataset_format: "yolo26" # export format
    model: "yolo26m-seg.pt" # pretrained model file
    epochs: 100 # training epochs
    batch: -1 # auto batch size
    imgsz: 640 # image resolution
    patience: 30 # early-stop patience
    requirements: "requirements.txt" # dependency file
    export: ["onnx"] # export trained model (onnx, torchscript etc.)

  detect:
    roboflow:
      workspace_id: "valvar" # Roboflow workspace
      project_id: "simulator_valve" # dataset project
      version: 1 # dataset version
      dataset_format: "yolo26" # export format
    model: "yolo26l.pt" # pretrained model file
    epochs: 200 # training epochs
    batch: -1 # auto batch size
    imgsz: 640 # image resolution
    patience: 30 # early-stop patience
    requirements: "requirements.txt" # dependency file
    export: ["onnx"] # export trained model (onnx, torchscript etc.)

  obb:
    roboflow:
      workspace_id: "valvar" # Roboflow workspace
      project_id: "obb_sim_front_handle" # dataset project
      version: 5 # dataset version
      dataset_format: "yolo26" # export format
    model: "yolo26l-obb.pt" # pretrained model file
    epochs: 150 # training epochs
    batch: -1 # auto batch size
    imgsz: 640 # image resolution
    patience: 20 # early-stop patience
    requirements: "requirements.txt" # dependency file
    export: ["onnx"] # export trained model (onnx, torchscript etc.)''

  classify:
    roboflow:
      workspace_id: "hei-qp1ee" # Roboflow workspace
      project_id: "end-of-pipline" # dataset project
      version: 4 # dataset version
      dataset_format: "folder" # export format
    model: "yolo26m-cls.pt" # pretrained model file
    epochs: 200 # training epochs
    batch: -1 # auto batch size
    imgsz: 244 # image resolution
    patience: 200 # early-stop patience
    requirements: "requirements.txt" # dependency file
    export: ["onnx"] # export trained model (onnx, torchscript etc.)''
